name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @conversa/shared build
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r --filter '!@conversa/e2e' test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Throwaway credentials for the CI database only.
          POSTGRES_USER: conversa
          POSTGRES_PASSWORD: conversa
          POSTGRES_DB: conversa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U conversa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://conversa:conversa@localhost:5432/conversa
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @conversa/shared build
      - name: Generate throwaway secrets
        run: node scripts/generate-secrets.mjs >> "$GITHUB_ENV"
      - run: pnpm --filter @conversa/api db:generate
      - run: pnpm --filter @conversa/api db:deploy
      - name: Run integration tests
        run: |
          if [ -f apps/api/jest.integration.config.js ]; then
            pnpm --filter @conversa/api test:integration --passWithNoTests
          else
            echo "apps/api/jest.integration.config.js not found, skipping."
          fi

  docker:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: false
          tags: conversa-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: conversa
          POSTGRES_PASSWORD: conversa
          POSTGRES_DB: conversa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U conversa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://conversa:conversa@localhost:5432/conversa
      REDIS_URL: redis://localhost:6379
      INSTAGRAM_SANDBOX: 'true'
    steps:
      - uses: actions/checkout@v5
      # Runs only once the e2e package exists.
      - id: e2e
        run: echo "present=${{ hashFiles('e2e/package.json') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.e2e.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.e2e.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.e2e.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.e2e.outputs.present == 'true'
        name: Generate throwaway secrets
        run: node scripts/generate-secrets.mjs >> "$GITHUB_ENV"
      - if: steps.e2e.outputs.present == 'true'
        run: pnpm build
      - if: steps.e2e.outputs.present == 'true'
        run: pnpm --filter @conversa/api db:deploy
      - if: steps.e2e.outputs.present == 'true'
        run: pnpm --filter @conversa/e2e exec playwright install --with-deps chromium
      - if: steps.e2e.outputs.present == 'true'
        run: pnpm test:e2e
      - if: failure() && steps.e2e.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - if: steps.e2e.outputs.present != 'true'
        run: echo "No e2e package yet, nothing to run."
