name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @conversa/shared build
      - run: pnpm format:check
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r --filter '!@conversa/e2e' test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Throwaway credentials for the CI database only.
          POSTGRES_USER: conversa
          POSTGRES_PASSWORD: conversa
          POSTGRES_DB: conversa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U conversa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://conversa:conversa@localhost:5432/conversa
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @conversa/shared build
      - name: Generate throwaway secrets
        run: node scripts/generate-secrets.mjs >> "$GITHUB_ENV"
      - run: pnpm --filter @conversa/api db:generate
      - run: pnpm --filter @conversa/api db:deploy
      - name: Run integration tests
        run: |
          if [ -f apps/api/jest.integration.config.js ]; then
            pnpm --filter @conversa/api test:integration --passWithNoTests
          else
            echo "apps/api/jest.integration.config.js not found, skipping."
          fi

  docker:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: false
          tags: conversa-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Throwaway credentials for the CI database only. The e2e run
          # creates and drops its own database (conversa_e2e) next to this one.
          POSTGRES_USER: conversa
          POSTGRES_PASSWORD: conversa
          POSTGRES_DB: conversa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U conversa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: '1'
      DATABASE_URL: postgresql://conversa:conversa@localhost:5432/conversa
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @conversa/e2e exec playwright install --with-deps chromium
      # Builds shared, api and web, then starts its own stack on ports 4100
      # and 3100 with a simulated Instagram and fresh secrets.
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
