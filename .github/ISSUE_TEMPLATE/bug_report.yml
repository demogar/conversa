name: Bug report
description: Something in Conversa does not work as expected.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please remove tokens, passwords,
        hostnames, account names and any other personal data from logs and screenshots.
        Security issues must be reported privately, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Conversa version
      description: Release tag, image tag or commit.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How do you run Conversa?
      options:
        - Docker Compose (docker/compose.yml)
        - Published images, other orchestrator
        - From source (pnpm dev)
        - Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Automations
        - Inbox and contacts
        - Instagram connection and webhooks
        - Accounts, sign-in and workspaces
        - Settings and integrations
        - Installation and upgrades
        - Other
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox 140 on Linux
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output from the api, worker or web containers, with secrets removed.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this has not been reported yet.
          required: true
        - label: I removed secrets and personal data from this report.
          required: true
