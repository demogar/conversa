packages:
  - apps/*
  - packages/*
  - e2e

# Only these dependencies may run install scripts.
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

# One copy of the icon set for the app and the design system.
overrides:
  lucide-react: 1.60.0
