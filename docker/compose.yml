# Conversa production stack.
#
#   cp .env.example .env          # then fill it in (pnpm secrets:generate)
#   pnpm docker:build             # or set API_IMAGE / WEB_IMAGE to published images
#   pnpm docker:up                # docker compose -f docker/compose.yml --env-file .env up -d
#
# Only the web server publishes a port, and by default only on 127.0.0.1, so
# it sits behind a reverse proxy or a tunnel. The web server proxies /api and
# /l to the API, so nothing else needs to be reachable from outside.
#
# With a Cloudflare Tunnel no inbound port is needed at all: set TUNNEL_TOKEN
# and TRUST_PROXY=cloudflare in .env, point the tunnel's public hostname at
# http://web:3000, and start the stack with `--profile tunnel`.
#
# Behind any other reverse proxy, set TRUST_PROXY to the number of proxies in
# front of the app (usually 1) so client IPs are read correctly.
name: conversa

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# Settings shared by the three roles of the API image.
x-api: &api
  image: ${API_IMAGE:-conversa-api:local}
  build:
    context: ..
    dockerfile: docker/api.Dockerfile
  # The stack reads the same .env as the rest of the repository.
  env_file: ${CONVERSA_ENV_FILE:-../.env}
  environment: &api-environment
    NODE_ENV: production
    DATABASE_URL: postgresql://${POSTGRES_USER:-conversa}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-conversa}
    REDIS_URL: redis://valkey:6379
    API_PORT: '4000'
  init: true
  logging: *logging
  networks: [backend, egress]

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conversa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-conversa}
    volumes:
      - postgres:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    networks: [backend]

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # BullMQ needs every job kept: persist to disk and never evict keys.
    command: ['valkey-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - valkey:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    networks: [backend]

  # Applies pending database migrations, then exits. The API and the worker
  # start only after it succeeds.
  migrate:
    <<: *api
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    command: ['node', 'dist/main.js']
    restart: unless-stopped
    environment:
      <<: *api-environment
      WORKER_IN_API: 'false'
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  worker:
    <<: *api
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    # Lets running jobs finish before the container is stopped.
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-conversa-web:local}
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
    init: true
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
    networks: [egress]

  # Optional: a Cloudflare Tunnel, so the host needs no inbound port.
  #   docker compose -f docker/compose.yml --env-file .env --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    profiles: [tunnel]
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    logging: *logging
    networks: [egress]

networks:
  # Databases live here, with no route to the outside world.
  backend:
    internal: true
  # The web server, the tunnel, and outgoing calls (Instagram, mail).
  egress: {}

volumes:
  postgres:
  valkey:
