# Local development services: PostgreSQL, Valkey (Redis-compatible) and
# Mailpit (catches outgoing mail). Credentials here are for local use only.
#
#   pnpm infra:up
#
# To run them on another machine, point Docker at it first, for example
# `export DOCKER_HOST=ssh://user@host`, and set the hosts in .env.
name: conversa-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: conversa
      POSTGRES_PASSWORD: conversa
      POSTGRES_DB: conversa
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U conversa']
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ['valkey-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${VALKEY_PORT:-6379}:6379'
    volumes:
      - valkey:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  postgres:
  valkey:
